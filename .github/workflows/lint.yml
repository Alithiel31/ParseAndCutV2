name: CI Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install Python linter
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint Python (flake8)
      run: flake8 app

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Lint frontend (oxlint)
      working-directory: frontend
      run: npm run lint
