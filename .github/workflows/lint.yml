name: CI Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python linter
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Install JS/CSS linters
      run: |
        npm install --save-dev eslint stylelint stylelint-config-standard

    - name: Lint Python (flake8)
      run: flake8 meetupKiller.py

    - name: Lint JavaScript (eslint)
      run: npx eslint static/js/main.js

    - name: Lint CSS (stylelint)
      run: npx stylelint static/css/style.css
