name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
        sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install JS/CSS linters
      run: |
        npm install --save-dev eslint stylelint stylelint-config-standard

    # --- LINTERS ---

    - name: Lint Python (flake8)
      run: flake8 meetupKiller.py

    - name: Lint JavaScript (eslint)
      run: npx eslint static/js/main.js

    - name: Lint CSS (stylelint)
      run: npx stylelint static/css/style.css

    # --- TESTS ---

    - name: Test import Flask app
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        RAILWAY_ENVIRONMENT: "true"
      run: |
        python -c "from meetupKiller import app, client, ALLOWED_EXTENSIONS; \
          print('✅ Import OK'); \
          assert app is not None, 'Flask app manquante'; \
          assert 'mp3' in ALLOWED_EXTENSIONS, 'Extensions manquantes'; \
          print('✅ Variables de config OK')"

    - name: Start app and wait for readiness
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        RAILWAY_ENVIRONMENT: "true"
        PORT: "5000"
      run: |
        python meetupKiller.py &
        for i in $(seq 1 15); do
          curl -sf http://127.0.0.1:5000/health && break
          echo "Tentative $i/15 — app pas encore prête..."
          sleep 1
        done

    - name: Test route /
      run: |
        curl -f http://127.0.0.1:5000/ \
          -o /dev/null -w "Status HTTP: %{http_code}\n" || exit 1

    - name: Test route /health
      run: |
        RESPONSE=$(curl -sf http://127.0.0.1:5000/health)
        echo "Réponse /health : $RESPONSE"
        STATUS=$(echo $RESPONSE | jq -r '.status')
        [ "$STATUS" = "ok" ] || exit 1

    - name: Test route /process sans fichier (doit renvoyer 400)
      run: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST http://127.0.0.1:5000/process)
        echo "Status reçu : $STATUS"
        [ "$STATUS" = "400" ] || exit 1

    - name: Test route /process format invalide (doit renvoyer 415)
      run: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -X POST http://127.0.0.1:5000/process \
          -F "audio=@meetupKiller.py")
        echo "Status reçu : $STATUS"
        [ "$STATUS" = "415" ] || exit 1