server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Limite par défaut de Nginx (1 Mo) trop basse pour des enregistrements
    # audio (cours de plusieurs dizaines/centaines de Mo).
    client_max_body_size 500M;

    # Digital Asset Links pour le TWA (Play Store) — servi une fois le fichier ajouté
    location = /.well-known/assetlinks.json {
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy vers le backend FastAPI (ParseAndCutV2), same-origin
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Timeout par défaut de Nginx (60s) trop court : la transcription
        # (Whisper + IA) peut prendre plusieurs minutes sur un long
        # enregistrement. Aligné sur le timeout du client Groq (240s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
