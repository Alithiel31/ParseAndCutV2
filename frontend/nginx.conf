server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Limite par défaut de Nginx (1 Mo) trop basse pour des enregistrements
    # audio (cours de plusieurs dizaines/centaines de Mo).
    client_max_body_size 500M;

    # Digital Asset Links pour le TWA (Play Store) — servi une fois le fichier ajouté
    location = /.well-known/assetlinks.json {
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy vers le backend FastAPI (ParseAndCutV2), same-origin
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # IP client réelle transmise au backend, qui s'en sert comme clé du rate
        # limiter (voir app/main.py ProxyHeadersMiddleware) : sans ça, toutes les
        # requêtes semblent venir de ce conteneur nginx et partagent un seul quota.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout par défaut de Nginx (60s) trop court : la transcription
        # (Whisper + IA) peut prendre plusieurs minutes sur un long
        # enregistrement. Le client Groq (app/config.py) a un timeout de 240s
        # par appel avec jusqu'à 2 tentatives sur timeout (soit ~480s dans le
        # pire cas pour UN chunk) ; 600s laisse de la marge pour ce cas plus
        # quelques chunks supplémentaires traités normalement. Un fichier très
        # long où plusieurs chunks échouent et retentent simultanément peut
        # malgré tout dépasser ce budget — limite acceptée de l'architecture
        # actuelle (traitement synchrone, pas de job en arrière-plan).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
