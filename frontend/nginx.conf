server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Limite par défaut de Nginx (1 Mo) trop basse pour des enregistrements
    # audio (cours de plusieurs dizaines/centaines de Mo).
    client_max_body_size 500M;

    # --- En-têtes de sécurité HTTP ---
    # SPA 100% same-origin : aucun script/style/police externe (pas de CDN, pas de
    # Google Fonts), pas d'attribut style="" inline (React sans CSS-in-JS). Le
    # Markdown généré par le LLM est déjà assaini par DOMPurify côté client
    # (ResultView.tsx) avant injection DOM — cette CSP est une défense en
    # profondeur si jamais ce filtrage était contourné un jour.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Doublon défensif de frame-ancestors ci-dessus pour les navigateurs qui ne
    # supportent pas cette directive CSP.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Aucune de ces API n'est utilisée par l'app (upload d'un fichier déjà
    # enregistré, pas d'enregistrement live ni de géolocalisation).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # TLS terminé par Cloudflare (tunnel cloudflared en amont) ; ce nginx ne voit
    # que du HTTP, mais le header traverse le tunnel et arrive au navigateur sur
    # sa connexion HTTPS avec Cloudflare, donc il est bien honoré. Pas de
    # "preload" : ça nécessite une soumission à hstspreload.org quasi
    # irréversible, à envisager plus tard une fois le sous-domaine stabilisé.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Digital Asset Links pour le TWA (Play Store) — servi une fois le fichier ajouté
    location = /.well-known/assetlinks.json {
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy vers le backend FastAPI (ParseAndCutV2), same-origin
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # IP client réelle transmise au backend, qui s'en sert comme clé du rate
        # limiter (voir app/main.py ProxyHeadersMiddleware) : sans ça, toutes les
        # requêtes semblent venir de ce conteneur nginx et partagent un seul quota.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout par défaut de Nginx (60s) trop court : la transcription
        # (Whisper + IA) peut prendre plusieurs minutes sur un long
        # enregistrement. Le client Groq (app/config.py) a un timeout de 240s
        # par appel avec jusqu'à 2 tentatives sur timeout (soit ~480s dans le
        # pire cas pour UN chunk) ; 600s laisse de la marge pour ce cas plus
        # quelques chunks supplémentaires traités normalement. Un fichier très
        # long où plusieurs chunks échouent et retentent simultanément peut
        # malgré tout dépasser ce budget — limite acceptée de l'architecture
        # actuelle (traitement synchrone, pas de job en arrière-plan).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
