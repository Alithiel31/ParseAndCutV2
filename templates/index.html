<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Transcription et résumé de cours audio avec Whisper et Llama 3">
    <title>IA Course Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 Assistant Transcripteur <span>IA</span></h1>
            <p>Transcription Whisper · Structuration Llama 3 · Hébergé sur Railway</p>
        </header>

        <main class="card">
            <div class="upload-section">
                <label for="audioFile" class="drop-zone" id="dropZone">
                    <span class="icon">☁️</span>
                    <span class="text">Glissez votre fichier audio ici ou cliquez pour choisir</span>
                    <input type="file" id="audioFile" accept="audio/*" hidden>
                </label>
                <div id="fileName" class="file-name-display"></div>
                <div id="errorBanner" class="error-banner hidden"></div>
                <button id="submitBtn" class="btn-primary">🚀 Générer la fiche de révision</button>
            </div>

            <div id="loader" class="hidden">
                <div class="spinner"></div>
                <p id="statusText">Analyse audio en cours…</p>
                <div id="progressSteps" class="progress-steps"></div>
            </div>

            <section id="resultArea" class="hidden">
                <div class="result-header">
                    <h2>📝 Fiche de résumé</h2>
                    <button id="copyBtn" class="btn-secondary">📋 Copier</button>
                </div>
                <div id="statsBar" class="stats-bar hidden"></div>
                <div id="output" class="markdown-body"></div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
