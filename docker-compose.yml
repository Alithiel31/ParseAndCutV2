# Orchestration ParseAndCut : backend FastAPI (app/) + frontend PWA (frontend/),
# monorepo unique — les deux services partagent ce même dossier.
services:
  backend:
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8091:80"
    depends_on:
      - backend
    restart: unless-stopped
