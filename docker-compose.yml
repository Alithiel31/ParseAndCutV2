# Orchestration ParseAndCut : backend FastAPI (app/) + frontend PWA (frontend/),
# monorepo unique — les deux services partagent ce même dossier.
services:
  backend:
    build:
      context: .
    labels:
      - "homelab.tier=app"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - traefik-net
    labels:
      - "homelab.tier=app"
      - "traefik.enable=true"
      - "traefik.http.routers.parseandcut.rule=Host(`parseandcut.alithiel31.dev`)"
      - "traefik.http.routers.parseandcut.entrypoints=web"
      - "traefik.http.services.parseandcut.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
