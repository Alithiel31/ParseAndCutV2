# Orchestration ParseAndCut : backend FastAPI (ce repo) + frontend PWA (repo séparé).
# ⚠️ Les deux repos ne sont PAS dans le même dossier parent sur cette machine, donc
# le contexte de build du frontend pointe vers un chemin absolu. Si tu déplaces le
# repo ParseAndCutPWA, mets à jour le chemin ci-dessous.
services:
  backend:
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: C:/Users/jacqu/Documents/Claude/Projects/ParseAndCutPWA
    ports:
      - "8091:80"
    depends_on:
      - backend
    restart: unless-stopped
